@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Libre+Franklin:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

.bv-root * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
.bv-root {
  min-height: 100vh;
  font-family: 'Libre Franklin', system-ui, sans-serif;
  color: #16302a;
  background:
    radial-gradient(120% 80% at 50% -10%, #1f5b46 0%, #163f31 55%, #102c22 100%);
  padding: 18px 14px 120px;
  display: flex; flex-direction: column; align-items: center;
}
.bv-wrap { width: 100%; max-width: 640px; }

.bv-toast {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 70; max-width: 92%; text-align: center;
  font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  font-size: 16px; color: #14342b;
  background: #EAC72B; border-radius: 12px; padding: 13px 18px;
  box-shadow: 0 10px 26px rgba(0,0,0,.35);
  animation: toastIn .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---- Header ---- */
.bv-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.bv-brand { display: flex; flex-direction: column; }
.bv-title {
  font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: .18em;
  color: #f4ecd6; font-size: 26px; line-height: 1; text-transform: uppercase;
}
.bv-sub { font-family: 'DM Mono', monospace; color: #9fc9b5; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; margin-top: 6px; }
.bv-menu-btn {
  font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: .12em;
  font-size: 12px; color: #f4ecd6; background: rgba(255,255,255,.06);
  border: 1px solid rgba(244,236,214,.25); border-radius: 999px; padding: 9px 14px; cursor: pointer;
}
.bv-menu-btn:active { transform: scale(.96); }

/* ---- Banknote cards ---- */
.bv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 430px){ .bv-grid { grid-template-columns: 1fr; } }

.bv-note {
  position: relative; border-radius: 14px; overflow: hidden; cursor: pointer;
  background: linear-gradient(180deg, #fbf6e7 0%, #f3ead2 100%);

}

.bv-icon-opt { font-size:22px; line-height:1; background:#fff; border:2px solid rgba(20,48,42,.12); border-radius:10px; padding:9px 0; cursor:pointer; }
.bv-icon-opt.on { border-color:#2E9E57; background:#eafaf0; }
.bv-icon-opt:active { transform:scale(.94); }
.bv-color-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
.bv-color-opt { height:38px; border:none; border-radius:9px; cursor:pointer; box-shadow: inset 0 0 0 2px rgba(255,255,255,.4); }
.bv-color-opt.on { outline:3px solid #16302a; outline-offset:2px; }
.bv-color-opt:active { transform:scale(.94); }
.bv-input { flex:1; font-family:'Libre Franklin',sans-serif; font-size:15px; color:#16302a; background:#fff; border:1px solid rgba(20,48,42,.2); border-radius:9px; padding:11px 12px; outline:none; min-width:0; }
.bv-input:focus{ border-color:#2E9E57; }
.bv-x { background:none; border:none; color:#b23327; font-size:20px; cursor:pointer; padding:4px 6px; flex:none; }
.bv-add { width:100%; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:13px; color:#16302a; background:#eadfc2; border:1px dashed rgba(20,48,42,.35); border-radius:9px; padding:11px; cursor:pointer; }
.bv-two { display:flex; gap:12px; }
.bv-start { width:100%; margin-top:6px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.14em; font-size:17px; color:#fff; background:#2E9E57; border:none; border-radius:12px; padding:17px; cursor:pointer; box-shadow:0 8px 18px rgba(46,158,87,.4); }
.bv-start:disabled{ opacity:.4; box-shadow:none; }
.bv-start:active{ transform:scale(.99); }

</script>
<script>
/* Banca · Partida en vivo (UI de salas). Sincroniza vía Firebase Realtime DB. */
(function () {
  if (typeof document === "undefined") return;

  var KEY_ROOM = "banca:room", KEY_URL = "banca:fburl";

  function fbBase() {
    var u = localStorage.getItem(KEY_URL) || window.BANCA_DEFAULT_FB || "";
    return u.replace(/\/+$/, "");
  }
  function currentRoom() { return localStorage.getItem(KEY_ROOM) || ""; }
  function genCode() {
    var a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = "";
    for (var i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }
  function setRoom(code) {
    if (code) localStorage.setItem(KEY_ROOM, code);
    else localStorage.removeItem(KEY_ROOM);
    window.dispatchEvent(new CustomEvent("banca:room", { detail: code || null }));
    paint();
  }

  // Estilos
  var css = document.createElement("style");
  css.textContent =
    ".bv-live-btn{position:fixed;left:10px;bottom:10px;z-index:99999;font:600 13px/1 system-ui,sans-serif;" +
    "background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:20px;" +
    "padding:8px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}" +
    ".bv-live-btn.on{background:#1f7a44;border-color:#2E9E57}" +
    ".bv-live-back{position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.5);display:flex;" +
    "align-items:flex-end;justify-content:center}" +
    ".bv-live-panel{background:#0f241d;color:#eaf3ee;width:100%;max-width:460px;border-radius:16px 16px 0 0;" +
    "padding:18px 18px calc(18px + env(safe-area-inset-bottom));font:14px/1.4 system-ui,sans-serif;" +
    "box-shadow:0 -8px 30px rgba(0,0,0,.4)}" +
    ".bv-live-panel h3{margin:0 0 4px;font-size:18px}" +
    ".bv-live-panel p{margin:0 0 12px;opacity:.75;font-size:13px}" +
    ".bv-live-panel input{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:10px;" +
    "border:1px solid #2c5346;background:#0a1a15;color:#fff;font-size:15px}" +
    ".bv-live-panel button.act{width:100%;padding:12px;margin:6px 0;border:0;border-radius:10px;" +
    "font-size:15px;font-weight:700;color:#fff;cursor:pointer}" +
    ".bv-live-panel .g{background:#2E9E57}.bv-live-panel .b{background:#2A5CA8}" +
    ".bv-live-panel .r{background:#b23327}.bv-live-panel .n{background:#37554a}" +
    ".bv-live-code{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;margin:8px 0;" +
    "color:#7fe3a6}" +
    ".bv-live-row{display:flex;gap:8px}.bv-live-row button{flex:1}" +
    ".bv-live-x{background:none;border:0;color:#9fb8ad;font-size:22px;float:right;cursor:pointer;margin-top:-4px}" +
    ".bv-live-adv{color:#7fbfa0;font-size:12px;text-decoration:underline;cursor:pointer;display:inline-block;margin-top:6px}";
  document.head.appendChild(css);

  // Botón flotante
  var btn = document.createElement("button");
  btn.className = "bv-live-btn";
  btn.onclick = openPanel;

  var backdrop = null;

  function paint() {
    var room = currentRoom();
    btn.classList.toggle("on", !!room);
    btn.textContent = room ? "🟢 Sala " + room : "🌐 En vivo";
    if (backdrop) renderPanel();
  }

  function inviteLink(room) {
    return location.origin + location.pathname + "?room=" + room;
  }

  function renderPanel() {
    var room = currentRoom();
    var base = fbBase();
    var showAdv = backdrop.dataset.adv === "1";
    var html = '<button class="bv-live-x" data-a="close">✕</button>';
    html += "<h3>Partida en vivo</h3>";

    if (!base) {
      html += "<p>Para compartir la partida entre dispositivos necesitas una URL de " +
        "Firebase Realtime Database.</p>" +
        '<input id="bv-url" placeholder="https://tu-proyecto-default-rtdb.firebaseio.com" value="' +
        (localStorage.getItem(KEY_URL) || "") + '">' +
        '<button class="act g" data-a="saveurl">Guardar URL</button>';
    } else if (room) {
      html += "<p>Comparte este código o el enlace. Todos verán la misma partida en vivo.</p>";
      html += '<div class="bv-live-code">' + room + "</div>";
      html += '<button class="act b" data-a="copy">Copiar enlace de invitación</button>';
      html += '<button class="act r" data-a="leave">Salir de la sala</button>';
      html += '<span class="bv-live-adv" data-a="adv">Cambiar servidor</span>';
    } else {
      html += "<p>Crea una sala y comparte el código, o únete a una existente.</p>";
      html += '<button class="act g" data-a="create">Crear sala nueva</button>';
      html += '<input id="bv-join" placeholder="Código (ej: ABCD)" maxlength="8" style="text-transform:uppercase">';
      html += '<button class="act b" data-a="join">Unirme a la sala</button>';
      html += '<span class="bv-live-adv" data-a="adv">Cambiar servidor</span>';
    }

    if (showAdv && base) {
      html += '<input id="bv-url" placeholder="URL de Firebase" value="' +
        (localStorage.getItem(KEY_URL) || "") + '">' +
        '<button class="act n" data-a="saveurl">Guardar URL</button>';
    }

    backdrop.firstChild.innerHTML = html;

    backdrop.firstChild.querySelectorAll("[data-a]").forEach(function (elm) {
      elm.onclick = function () { action(elm.getAttribute("data-a")); };
    });
  }

  function action(a) {
    if (a === "close") { closePanel(); return; }
    if (a === "adv") { backdrop.dataset.adv = "1"; renderPanel(); return; }
    if (a === "saveurl") {
      var v = (document.getElementById("bv-url").value || "").trim();
      if (v) localStorage.setItem(KEY_URL, v); else localStorage.removeItem(KEY_URL);
      backdrop.dataset.adv = "";
      renderPanel();
      return;
    }
    if (a === "create") { setRoom(genCode()); return; }
    if (a === "join") {
      var c = (document.getElementById("bv-join").value || "").trim().toUpperCase();
      if (c) setRoom(c);
      return;
    }
    if (a === "leave") {
      if (confirm("¿Salir de la sala? Seguirás con tu copia local de la partida.")) setRoom("");
      return;
    }
    if (a === "copy") {
      var link = inviteLink(currentRoom());
      try {
        navigator.clipboard.writeText(link).then(function () { toast("Enlace copiado"); },
          function () { prompt("Copia el enlace:", link); });
      } catch (e) { prompt("Copia el enlace:", link); }
      return;
    }
  }

  function toast(msg) {
    var t = document.createElement("div");
    t.textContent = msg;
    t.style.cssText = "position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:100000;" +
      "background:#000;color:#fff;padding:8px 14px;border-radius:20px;font:13px system-ui;opacity:.9";
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1600);
  }

  function openPanel() {
    if (backdrop) return;
    backdrop = document.createElement("div");
    backdrop.className = "bv-live-back";
    backdrop.dataset.adv = "";
    var panel = document.createElement("div");
    panel.className = "bv-live-panel";
    backdrop.appendChild(panel);
    backdrop.onclick = function (ev) { if (ev.target === backdrop) closePanel(); };
    document.body.appendChild(backdrop);
    renderPanel();
  }
  function closePanel() { if (backdrop) { backdrop.remove(); backdrop = null; } }

  // Auto-unirse si la URL trae ?room=CODE
  try {
    var qp = new URLSearchParams(location.search).get("room");
    if (qp && !currentRoom()) localStorage.setItem(KEY_ROOM, qp.toUpperCase());
  } catch (e) {}

  document.body.appendChild(btn);
  paint();
  // Notifica a React el estado inicial de sala
  window.dispatchEvent(new CustomEvent("banca:room", { detail: currentRoom() || null }));
})();

</script>
</body>
</html>
