<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saber 11 · Juego de repaso ICFES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100E24;
  --surface:#1B1742;
  --surface-2:#252059;
  --line:rgba(255,255,255,.10);
  --ink:#F3EFFF;
  --ink-dim:#A79FD0;
  --coin:#F5C542;
  --ciencia:#3DE0AE;
  --arte:#FF6FB5;
  --historia:#F5A524;
  --geografia:#4CC9F0;
  --deportes:#FF7A45;
  --entretenimiento:#A78BFA;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #2A2166 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--body);
  min-height:100vh;
  padding:18px 14px 40px;
}
button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}

/* ---------- header ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;line-height:.95}
h1 span{color:var(--coin)}
.tagline{color:var(--ink-dim);font-size:13px;margin-top:4px}
.turn-chip{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 8px;
}
.turn-chip .dot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.25) inset}
.turn-chip .who{font-weight:700;font-size:15px;line-height:1.1}
.turn-chip .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.snd{
  width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  font-size:17px;line-height:1
}
.snd:hover{border-color:var(--coin)}
.snd.off{opacity:.45}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:18px;align-items:start}
@media(max-width:880px){.layout{grid-template-columns:1fr}}

/* ---------- board ---------- */
.board{
  background:linear-gradient(160deg,#221C52,#171238);
  border:1px solid var(--line);border-radius:22px;padding:12px;
  display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(5,1fr);
  gap:5px;aspect-ratio:9/5.6;
}
.tile{
  border-radius:9px;position:relative;display:flex;align-items:center;justify-content:center;
  background:var(--c);border:1px solid rgba(255,255,255,.18);
  transition:transform .18s ease, box-shadow .18s ease;
}
.tile .glyph{font-size:clamp(9px,1.5vw,15px);line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.35);position:absolute;top:3px;left:0;right:0;text-align:center;opacity:.9}
.tile.crown{border:2px solid #fff;background:linear-gradient(140deg,#F5C542,#E09A12);box-shadow:0 0 0 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35)}
.tile.duel{background:linear-gradient(140deg,#4A2140,#301429);border-color:rgba(255,111,181,.55)}
.tile.hot{transform:scale(1.14);box-shadow:0 0 0 3px var(--coin),0 8px 22px rgba(0,0,0,.5);z-index:4}
.tokens{position:absolute;inset:auto 0 0 0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:2px;padding:0 2px 3px;z-index:3}
.token{
  width:clamp(20px,3vw,30px);height:clamp(20px,3vw,30px);border-radius:50%;
  border:2px solid rgba(255,255,255,.92);font-size:clamp(12px,2vw,18px);
  display:flex;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 2px 5px rgba(0,0,0,.55);margin-top:-6px;
  animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}

/* center of board */
.center{
  grid-column:2/9;grid-row:2/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(circle at 50% 40%, #2E2670, #1A1541);
  border:1px solid var(--line);border-radius:16px;padding:10px;
}
.die{
  width:clamp(54px,7vw,72px);height:clamp(54px,7vw,72px);border-radius:16px;background:#FFFDF5;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;gap:2px;
  box-shadow:0 8px 0 #C8C0A8, 0 12px 24px rgba(0,0,0,.45);
}
.pip{width:100%;height:100%;border-radius:50%;background:#171238;opacity:0;justify-self:center;align-self:center}
.pip.on{opacity:1}
.die.roll{animation:shake .5s ease}
@keyframes shake{
  0%{transform:rotate(0) translateY(0)}25%{transform:rotate(-14deg) translateY(-8px)}
  50%{transform:rotate(12deg) translateY(0)}75%{transform:rotate(-6deg) translateY(-4px)}100%{transform:rotate(0)}
}
.roll-btn{
  background:var(--coin);color:#241B00;font-weight:700;font-size:14px;letter-spacing:.02em;
  padding:10px 22px;border-radius:999px;box-shadow:0 4px 0 #B98F17;transition:transform .1s
}
.roll-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #B98F17}
.roll-btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.center-note{font-size:11px;color:var(--ink-dim);text-align:center;min-height:14px}

/* ---------- sidebar ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.panel + .panel{margin-top:14px}
.panel h2{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px}
.player{
  display:flex;align-items:center;gap:11px;padding:9px;border-radius:12px;border:1px solid transparent;
}
.player.active{background:var(--surface-2);border-color:var(--line)}
.crownwheel{
  width:46px;height:46px;border-radius:50%;flex:none;position:relative;cursor:pointer;
  box-shadow:0 0 0 2px rgba(0,0,0,.4) inset;
}
.crownwheel .ce{
  position:absolute;inset:24%;border-radius:50%;background:var(--surface);
  border:2px solid var(--pc);display:flex;align-items:center;justify-content:center;
  font-size:14px;line-height:1;
}
.crownwheel:hover .ce{border-color:var(--coin)}
.player.active .crownwheel .ce{background:var(--surface-2)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:5px}
@media(max-width:420px){.emojis{grid-template-columns:repeat(6,1fr)}}
.em{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;font-size:19px;background:var(--bg);line-height:1}
.em:hover{border-color:var(--ink-dim)}
.em.sel{border-color:var(--coin);background:var(--surface-2);box-shadow:0 0 0 1px var(--coin)}
.em.taken{opacity:.2;pointer-events:none}
.p-meta{flex:1;min-width:0}
.p-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.p-name .x{color:var(--ink-dim);font-size:15px;line-height:1;opacity:.5}
.p-name .x:hover{opacity:1;color:var(--arte)}
.p-sub{font-size:11px;color:var(--ink-dim);display:flex;gap:10px;margin-top:2px}
.coins{color:var(--coin);font-weight:700}
.ghost{
  width:100%;margin-top:10px;border:1px dashed var(--line);border-radius:12px;padding:9px;
  font-size:13px;color:var(--ink-dim)
}
.ghost:hover{color:var(--ink);border-color:var(--coin)}

.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.leg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-dim)}
.leg i{width:11px;height:11px;border-radius:3px;flex:none}
.smallbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sbtn{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;color:var(--ink-dim)}
.sbtn:hover{color:var(--ink);border-color:var(--ink-dim)}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(8,6,22,.82);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:16px;z-index:50
}
.scrim.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:22px;width:min(560px,100%);
  overflow:hidden;animation:rise .22s ease;max-height:92vh;overflow-y:auto
}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.q-head{padding:14px 18px;background:var(--c);color:#0D0A22}
.q-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.q-right{text-align:right;flex:none}
.q-clock{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.q-clock.low{animation:pulse .5s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(1.12)}}
.q-diff{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-top:3px}
.q-pause{
  margin-top:5px;background:rgba(13,10,34,.16);color:#0D0A22;border:1px solid rgba(13,10,34,.28);
  border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;line-height:1
}
.q-pause:hover{background:rgba(13,10,34,.28)}
.q-pause.paused{background:#0D0A22;color:var(--c)}
.picks{display:grid;gap:8px;margin-top:12px}
.pick{
  display:flex;align-items:center;gap:11px;text-align:left;padding:13px 14px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);font-size:15px;font-weight:500;transition:transform .1s
}
.pick:hover{border-color:var(--c);transform:translateX(3px)}
.pick .pe{font-size:20px;line-height:1}
.hot-streak{color:var(--coin)}
.streak-tag{font-size:11px;color:var(--ink-dim)}
.streak-tag.hot-streak{color:var(--coin)}
.claim{
  margin-top:7px;width:100%;background:var(--coin);color:#241B00;font-weight:700;font-size:12px;
  padding:7px;border-radius:9px;animation:pulse 1.6s infinite
}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.ctrls label{margin:0 0 4px}
.ctrls select{padding:8px 9px;font-size:13px}
.ctrl-wide{grid-column:1/-1}
.goal-editor{display:flex;align-items:stretch;gap:7px}
.goal-editor .stp{
  width:40px;flex:none;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
  font-size:20px;font-weight:700;color:var(--ink);line-height:1;display:flex;align-items:center;justify-content:center
}
.goal-editor .stp:hover{border-color:var(--coin)}
.goal-editor .stp:active{transform:translateY(2px)}
.goal-editor input{
  flex:1;text-align:center;padding:8px 6px;font-family:var(--display);font-weight:800;
  font-size:18px;font-variant-numeric:tabular-nums
}
.goal-editor input::-webkit-outer-spin-button,.goal-editor input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.q-cat{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;text-transform:capitalize}
.q-badge{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.timer{height:5px;background:rgba(0,0,0,.25)}
.timer i{display:block;height:100%;background:#0D0A22;width:100%}
.q-body{padding:18px}
.q-text{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-bottom:14px}
.q-fig:not(:empty){margin-bottom:16px}
.q-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg);border-radius:10px;overflow:hidden}
.q-table th,.q-table td{border:1px solid var(--line);padding:7px 9px;text-align:center}
.q-table th{background:var(--surface-2);font-weight:700;font-size:12px}
.fig-svg{display:flex;justify-content:center;background:#fff;border-radius:12px;padding:12px}
.fig-svg svg{max-width:100%;height:auto}
.fig-img{display:flex;justify-content:center;background:#fff;border-radius:12px;padding:12px}
.fig-img img{max-width:100%;height:auto;display:block;border-radius:4px}
.fig-sign{
  background:#EDE8FF;color:#2A2140;border:2px dashed #8B7FC0;border-radius:10px;
  padding:16px;text-align:center;font-family:'Bricolage Grotesque',cursive;font-weight:700;font-size:18px;line-height:1.3
}
.fig-text{
  background:var(--bg);border-left:3px solid var(--c);border-radius:8px;padding:12px 14px;
  font-size:13.5px;line-height:1.5;color:var(--ink-dim);max-height:200px;overflow-y:auto;white-space:pre-line
}
.exp{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-dim);line-height:1.45}
.cont-btn{margin-top:12px;width:100%;background:var(--c);color:#0D0A22;font-weight:700;padding:10px;border-radius:10px;font-size:14px}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;padding:13px 15px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);font-size:15px;transition:transform .1s
}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.18;text-decoration:line-through}
.opt.right{background:#1D6B4F;border-color:#3DE0AE}
.opt.wrong{background:#6B1D3A;border-color:#FF6FB5}
.opt.hint{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.help{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.hbtn{
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.25;
  display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:76px
}
.hbtn b{font-size:16px}
.hbtn small{color:var(--coin);font-weight:700}
.hbtn:hover:not(:disabled){border-color:var(--coin)}
.hbtn:disabled{opacity:.3;cursor:not-allowed}
.verdict{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;display:none}
.verdict.show{display:block}
.verdict b{font-family:var(--display)}

/* forms */
.form{padding:18px}
.form h3{font-family:var(--display);font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin:10px 0 5px}
input,select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;color:var(--ink);font-family:var(--body);font-size:14px
}
.row{display:flex;gap:8px;align-items:center}
.row input[type=radio]{width:auto;flex:none;accent-color:var(--coin)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.primary{background:var(--coin);color:#241B00;font-weight:700;padding:10px 18px;border-radius:999px}
.secondary{border:1px solid var(--line);padding:10px 18px;border-radius:999px;color:var(--ink-dim)}
.win{text-align:center;padding:34px 22px}
.win .big{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.03em;margin:10px 0}
.confetti{font-size:52px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a href="index.html" style="display:inline-block;color:var(--ink-dim);text-decoration:none;font-size:13px;margin-bottom:6px">← Menú de juegos</a>
      <h1>SABER 11<span>.</span></h1>
      <p class="tagline">Repaso tipo ICFES: rueda el dado, responde por materia y llévate los stickers. Reúne las 6 pruebas y ganas.</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="snd" id="sndBtn" title="Silenciar / activar sonido">🔊</button>
      <div class="turn-chip">
        <div class="dot" id="turnDot"></div>
        <div>
          <div class="lbl">Juega</div>
          <div class="who" id="turnName">—</div>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <div>
      <div class="board" id="board"></div>
    </div>

    <aside>
      <div class="panel">
        <h2>Jugadores</h2>
        <div id="players"></div>
        <button class="ghost" id="addPlayerBtn">+ Agregar jugador</button>
      </div>

      <div class="panel">
        <h2>Categorías</h2>
        <div class="legend" id="legend"></div>
        <div class="ctrls">
          <div>
            <label for="diff">Dificultad</label>
            <select id="diff">
              <option value="mix">Mezcladas</option>
              <option value="1">Solo normales</option>
              <option value="2">Solo difíciles</option>
            </select>
          </div>
          <div>
            <label for="limit">Tiempo</label>
            <select id="limit">
              <option value="20">20 s</option>
              <option value="30" selected>30 s</option>
              <option value="45">45 s</option>
              <option value="60">60 s</option>
              <option value="999">Sin límite</option>
            </select>
          </div>
          <div class="ctrl-wide">
            <label for="goal">Racha para corona 👑</label>
            <div class="goal-editor">
              <button class="stp" id="goalMinus" type="button" aria-label="Bajar meta de racha">−</button>
              <input id="goal" type="number" min="1" max="30" inputmode="numeric" aria-label="Aciertos seguidos para ganar una corona">
              <button class="stp" id="goalPlus" type="button" aria-label="Subir meta de racha">+</button>
            </div>
          </div>
        </div>
        <div class="smallbtns">
          <button class="sbtn" id="addQBtn">+ Agregar pregunta</button>
          <button class="sbtn" id="exportBtn">Descargar preguntas</button>
          <button class="sbtn" id="importBtn">Cargar preguntas</button>
          <button class="sbtn" id="resetBtn">Reiniciar partida</button>
        </div>
        <input type="file" id="fileIn" accept="application/json" hidden>
        <p class="tagline" id="qcount" style="margin-top:10px"></p>
      </div>
    </aside>
  </div>
</div>

<!-- Pregunta -->
<div class="scrim" id="qScrim">
  <div class="modal" id="qModal">
    <div class="q-head" id="qHead">
      <div class="q-top">
        <div>
          <div class="q-badge" id="qBadge">Pregunta</div>
          <div class="q-cat" id="qCat"></div>
        </div>
        <div class="q-right">
          <div class="q-clock" id="timerNum">30s</div>
          <button class="q-pause" id="pauseBtn" title="Pausar para analizar">⏸ Pausa</button>
          <div class="q-diff" id="qDiff"></div>
        </div>
      </div>
    </div>
    <div class="timer"><i id="timerBar"></i></div>
    <div class="q-body">
      <div class="q-text" id="qText"></div>
      <div class="q-fig" id="qFig"></div>
      <div class="opts" id="qOpts"></div>
      <div class="help" id="qHelp"></div>
      <div class="verdict" id="qVerdict"></div>
    </div>
  </div>
</div>

<!-- Agregar jugador -->
<div class="scrim" id="pScrim">
  <div class="modal">
    <div class="form">
      <h3 id="pTitle">Agregar jugador</h3>
      <label for="pName">Nombre</label>
      <input id="pName" maxlength="14" placeholder="Ej. Fabián">
      <label>Ficha</label>
      <div class="emojis" id="pEmojis"></div>
      <div class="actions">
        <button class="secondary" data-close>Cancelar</button>
        <button class="primary" id="pSave">Agregar</button>
      </div>
    </div>
  </div>
</div>

<!-- Agregar pregunta -->
<div class="scrim" id="nqScrim">
  <div class="modal">
    <div class="form">
      <h3>Agregar pregunta</h3>
      <label for="nqCat">Categoría</label>
      <select id="nqCat"></select>
      <label for="nqDiff">Dificultad</label>
      <select id="nqDiff"><option value="1">Normal</option><option value="2">Difícil</option></select>
      <label for="nqText">Pregunta</label>
      <textarea id="nqText" rows="2" placeholder="¿Qué...?"></textarea>
      <label>Respuestas — marca la correcta</label>
      <div id="nqOpts"></div>
      <div class="actions">
        <button class="secondary" data-close>Cancelar</button>
        <button class="primary" id="nqSave">Guardar pregunta</button>
      </div>
    </div>
  </div>
</div>

<!-- Selector genérico -->
<div class="scrim" id="cScrim">
  <div class="modal">
    <div class="form">
      <h3 id="cTitle"></h3>
      <p class="tagline" id="cSub"></p>
      <div class="picks" id="cPicks"></div>
      <div class="actions">

<script>
/* ============ BANCO DE PREGUNTAS ============
   Los datos viven en data/*.js (cargados arriba) y se acumulan en window.BANCO.
   Aquí solo se leen. Para agregar/editar preguntas, edita el archivo de la materia. */
const CATS = BANCO.cats;
const catById = id => CATS.find(c=>c.id===id);
const QUESTIONS = BANCO.preguntas;

/* Validación del banco: llama validarBanco() en la consola para revisar el esquema.
   Reporta preguntas sin enunciado, sin opciones, o con img sin texto alternativo (alt). */
function validarBanco(){
  const errs=[]; let total=0;
  for(const cat of Object.keys(QUESTIONS)){
    QUESTIONS[cat].forEach((q,i)=>{ total++;
      const id=`[${cat} #${i} ${q.src||''}${q.n?('/'+q.n):''}]`;
      if(!q.q) errs.push(id+' sin enunciado (q)');
      if(!Array.isArray(q.a)||q.a.length<2) errs.push(id+' opciones insuficientes (a)');
      if(q.img && typeof q.img==='object' && !q.img.alt) errs.push(id+' img sin alt');
    });
  }
  console.log(`Banco: ${total} preguntas en ${Object.keys(QUESTIONS).length} categorías.`);
  if(errs.length){ console.warn('Problemas ('+errs.length+'):'); errs.forEach(e=>console.warn('  '+e)); }
  else console.log('Sin problemas de esquema.');
  return errs;
}

/* ============ TABLERO ============ */
/* 24 casillas en el perímetro de una grilla 9x5, en sentido horario. */
function perimeter(){
  const cells=[];
  for(let c=1;c<=9;c++) cells.push([1,c]);
  for(let r=2;r<=5;r++) cells.push([r,9]);
  for(let c=8;c>=1;c--) cells.push([5,c]);
  for(let r=4;r>=2;r--) cells.push([r,1]);
  return cells;
}
const CELLS = perimeter();
const DUELS = [2,10,18];
let normalCount=0;
const TILES = CELLS.map((cell,i)=>{
  if(i%4===0) return {cell,type:'corona',cat:null};
  if(DUELS.includes(i)) return {cell,type:'duelo',cat:null};
  return {cell,type:'normal',cat:CATS[(normalCount++)%6].id};
});

/* ============ SONIDO (sintetizado, sin archivos) ============ */
const SND={ctx:null, on:true};
function ac(){
  if(!SND.ctx) SND.ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(SND.ctx.state==='suspended') SND.ctx.resume();
  return SND.ctx;
}
function tone(freq,at,dur,{type='sine',vol=.18,to=null}={}){
  if(!SND.on) return;
  const c=ac(), t=c.currentTime+at;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noise(at,dur,vol=.13){
  if(!SND.on) return;
  const c=ac(), t=c.currentTime+at, n=c.sampleRate*dur;
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800;
  const g=c.createGain(); g.gain.value=vol;
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const SFX={
  step(i){ tone(520+i*45,0,.09,{type:'square',vol:.08}); },
  dice(){ for(let i=0;i<5;i++) noise(i*0.075,.05,.1); },
  coin(){ tone(988,0,.08,{type:'square',vol:.14}); tone(1319,.08,.42,{type:'square',vol:.14}); },
  right(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.075,.28,{type:'triangle',vol:.16})); },
  wrong(){ tone(196,0,.5,{type:'sawtooth',vol:.14,to:82}); tone(98,.05,.42,{type:'square',vol:.08}); },
  crown(){ [392,523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.5,{type:'triangle',vol:.17}));
           [1568,2093].forEach((f,i)=>tone(f,.5+i*.1,.4,{type:'sine',vol:.1})); },
  help(){ tone(300,0,.16,{type:'sine',vol:.13,to:900}); },
  tick(){ tone(1400,0,.045,{type:'square',vol:.05}); },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.5,{type:'triangle',vol:.18}));
         [130,196].forEach((f,i)=>tone(f,i*.4,.7,{type:'sine',vol:.1})); }
};
const sndBtn=document.getElementById('sndBtn');
sndBtn.onclick=()=>{
  SND.on=!SND.on;
  sndBtn.textContent=SND.on?'🔊':'🔇';
  sndBtn.classList.toggle('off',!SND.on);
  if(SND.on) SFX.help();
};
document.getElementById('pauseBtn').onclick=togglePause;

/* ============ ESTADO ============ */
const COLORS=['#4CC9F0','#FF7A45','#3DE0AE','#FF6FB5','#A78BFA','#F5C542'];
const EMOJIS=['🦊','🐼','🐯','🦁','🐸','🐵','🦄','🐙','🐝','🦖','🐺','🐨','🐧','🦉','🐲','🦋','👻','🤖','👽','🎩','💎','🚀','⚡','🍕'];
let state, tokenAnim=false, editing=null;
let STREAK_GOAL=10;
const GOAL_MIN=1, GOAL_MAX=30;
let LIMIT=30;

function newPlayer(name,i){
  const used=(state&&state.players?state.players.map(p=>p.emoji):[]);
  return {id:crypto.randomUUID?crypto.randomUUID():String(Math.random()),
    name, emoji: EMOJIS.find(e=>!used.includes(e))||EMOJIS[i%EMOJIS.length],
    color:COLORS[i%COLORS.length], pos:0, coins:80, wedges:[], streak:0};
}
function reset(defs){
  const list = defs || [{name:'Danny'},{name:'Fabián'}];
  state={players:[], turn:0, extraRoll:false};
  list.forEach((d,i)=>{
    const p=newPlayer(d.name,i);
    if(d.emoji) p.emoji=d.emoji;
    if(d.streak) p.streak=d.streak;
    state.players.push(p);
  });
  renderAll();
}
const rosterOf=()=>state.players.map(p=>({name:p.name,emoji:p.emoji,streak:p.streak}));

/* ============ RENDER ============ */
const $ = s=>document.querySelector(s);
const board=$('#board');

function renderBoard(){
  board.innerHTML='';
  TILES.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='tile'+(t.type==='duelo'?' duel':'')+(t.type==='corona'?' crown':'');
    el.style.gridRow=t.cell[0]; el.style.gridColumn=t.cell[1];
    el.style.setProperty('--c', t.cat? catById(t.cat).color : 'transparent');
    el.dataset.i=i;
    el.title = t.type==='duelo' ? 'Duelo' : (t.type==='corona' ? 'Sticker: eliges la prueba' : catById(t.cat).name);
    const g=document.createElement('div'); g.className='glyph';
    g.textContent = t.type==='duelo' ? '⚔️' : (t.type==='corona' ? '👑' : catById(t.cat).glyph);
    el.appendChild(g);
    const tk=document.createElement('div'); tk.className='tokens'; el.appendChild(tk);
    board.appendChild(el);
  });
  const c=document.createElement('div'); c.className='center';
  c.innerHTML=`<div class="die" id="die"></div>
    <button class="roll-btn" id="rollBtn">Lanzar dado</button>
    <div class="center-note" id="note"></div>`;
  board.appendChild(c);
  drawDie(1);
  $('#rollBtn').addEventListener('click', roll);
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawDie(n){
  const d=$('#die'); d.innerHTML='';
  for(let i=0;i<9;i++){
    const p=document.createElement('div');
    p.className='pip'+(PIPS[n].includes(i)?' on':'');
    d.appendChild(p);
  }
}
function renderTokens(){
  document.querySelectorAll('.tokens').forEach(t=>t.innerHTML='');
  state.players.forEach(p=>{
    const tile=board.querySelector(`.tile[data-i="${p.pos}"] .tokens`);
    if(!tile) return;
    const el=document.createElement('div');
    el.className='token'; el.style.background=p.color; el.textContent=p.emoji;
    el.title=p.name;
    tile.appendChild(el);
  });
}
function wheelGradient(p){
  const stops=CATS.map((c,i)=>{
    const col = p.wedges.includes(c.id) ? c.color : 'rgba(255,255,255,.09)';
    return `${col} ${i*60}deg ${(i+1)*60}deg`;
  }).join(',');
  return `conic-gradient(${stops})`;
}
function renderPlayers(){
  const box=$('#players'); box.innerHTML='';
  state.players.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='player'+(i===state.turn?' active':'');
    const listo = p.streak>=STREAK_GOAL && p.wedges.length<6;
    el.innerHTML=`
      <div class="crownwheel" style="background:${wheelGradient(p)};--pc:${p.color}" data-edit="${p.id}" title="Cambiar nombre o ficha"><span class="ce">${p.emoji}</span></div>
      <div class="p-meta">
        <div class="p-name">${escapeHtml(p.name)} ${state.players.length>1?`<button class="x" data-del="${p.id}" title="Quitar jugador">×</button>`:''}</div>
        <div class="p-sub"><span class="coins">🪙 ${p.coins}</span><span>👑 ${p.wedges.length}/6</span><span class="streak-tag ${p.streak?'hot-streak':''}" title="Racha actual">🔥 ${p.streak}/${STREAK_GOAL}</span></div>
        ${listo?`<button class="claim" data-claim="${p.id}">👑 Sticker gratis</button>`:''}
      </div>`;
    box.appendChild(el);
  });
  box.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claimStreak(state.players.find(p=>p.id===b.dataset.claim)));
  box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openPlayerModal(b.dataset.edit));
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const idx=state.players.findIndex(p=>p.id===b.dataset.del);
    state.players.splice(idx,1);
    if(state.turn>=state.players.length) state.turn=0;
    renderAll();
  });
  const cur=state.players[state.turn];
  $('#turnName').textContent=cur.name;
  $('#turnDot').style.background=cur.color;
}
function renderLegend(){
  $('#legend').innerHTML=CATS.map(c=>`<div class="leg"><i style="background:${c.color}"></i>${c.name}</div>`).join('');
  const n=Object.values(QUESTIONS).reduce((a,b)=>a+b.length,0);
  $('#qcount').textContent=`${n} preguntas cargadas.`;
}
function renderAll(){renderBoard();renderTokens();renderPlayers();renderLegend();}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ TURNO ============ */
const cur=()=>state.players[state.turn];
async function roll(){
  if(tokenAnim) return;
  tokenAnim=true;
  $('#rollBtn').disabled=true; $('#note').textContent='';
  const die=$('#die'); die.classList.add('roll');
  SFX.dice();
  for(let i=0;i<8;i++){drawDie(1+Math.floor(Math.random()*6)); await sleep(55);}
  const n=1+Math.floor(Math.random()*6);
  drawDie(n); die.classList.remove('roll');
  await sleep(180);
  const p=cur();
  for(let s=0;s<n;s++){
    p.pos=(p.pos+1)%TILES.length;
    SFX.step(s);
    renderTokens(); await sleep(150);
  }
  const tile=board.querySelector(`.tile[data-i="${p.pos}"]`);
  tile.classList.add('hot'); await sleep(320); tile.classList.remove('hot');
  tokenAnim=false;
  land(TILES[p.pos]);
}
function land(tile){
  if(tile.type==='duelo') return startDuel();
  if(tile.type==='corona') return crownTile();
  askQuestion(tile.cat,{player:cur(),onDone:endTurn});
}
function endTurn(ok){
  const p=cur();
  if(p.wedges.length===6) return win(p);
  state.extraRoll=!!ok;
  nextTurn(0);
}
function nextTurn(delay=0){
  setTimeout(()=>{
    if(state.extraRoll){ state.extraRoll=false; }
    else { state.turn=(state.turn+1)%state.players.length; }
    renderPlayers(); $('#rollBtn').disabled=false;
  },delay);
}

/* ============ CORONA ============ */
function grantWedge(p,cat){
  if(!p.wedges.includes(cat)) p.wedges.push(cat);
  renderPlayers();
}
function crownTile(){
  const p=cur();
  const falta=CATS.filter(c=>!p.wedges.includes(c.id));
  picker({
    title:`👑 Casilla de sticker`,
    sub:`${p.name} ${p.emoji}, elige la prueba por la que quieres pelear un sticker.`,
    items:falta.map(c=>({label:c.name, emoji:c.glyph, color:c.color, value:c.id})),
    onPick:cat=>askQuestion(cat,{player:p,crown:true,onDone:ok=>{
      if(ok){ grantWedge(p,cat); }
      endTurn(ok);
    }})
  });
}
/* Meta de racha para ganar una corona: editable en el panel, aplica a todos. */
function setGoal(n){
  n=parseInt(n,10);
  if(isNaN(n)) n=STREAK_GOAL;
  STREAK_GOAL=Math.max(GOAL_MIN,Math.min(GOAL_MAX,n));
  $('#goal').value=STREAK_GOAL;
  renderPlayers();  // refresca el x/n y muestra "Sticker gratis" si alguien ya la alcanzó
}
$('#goal').value=STREAK_GOAL;
$('#goalMinus').onclick=()=>{ setGoal(STREAK_GOAL-1); SFX.help(); };
$('#goalPlus').onclick =()=>{ setGoal(STREAK_GOAL+1); SFX.help(); };
$('#goal').onchange=e=>setGoal(e.target.value);
function claimStreak(p){
  const falta=CATS.filter(c=>!p.wedges.includes(c.id));
  picker({
    title:`🔥 Racha de ${p.streak}`,
    sub:`${p.name} ${p.emoji} se lleva un sticker sin preguntar. Elige la prueba. La racha vuelve a cero.`,
    items:falta.map(c=>({label:c.name, emoji:c.glyph, color:c.color, value:c.id})),
    cancel:true,
    onPick:cat=>{
      p.streak=0; grantWedge(p,cat); SFX.crown();
      $('#note').textContent=`${p.name} cobró su racha: sticker de ${catById(cat).name}`;
      if(p.wedges.length===6) win(p);
    }
  });
}

/* ============ DUELO ============ */
function startDuel(){
  const p=cur();
  const rivales=state.players.filter(x=>x.id!==p.id && x.wedges.length>0);
  if(!rivales.length){
    p.coins+=15; renderPlayers(); SFX.coin();
    $('#note').textContent='Nadie tiene stickers que robar. Te llevas 🪙 15 de consuelo.';
    return nextTurn(700);
  }
  picker({
    title:'⚔️ Casilla de duelo',
    sub:`${p.name} ${p.emoji}, ¿a quién retas?`,
    items:rivales.map(r=>({label:`${r.name} · ${r.wedges.length} 👑`, emoji:r.emoji, color:r.color, value:r.id})),
    cancel:true, onCancel:()=>nextTurn(0),
    onPick:id=>pickWedge(p, state.players.find(x=>x.id===id))
  });
}
function pickWedge(atk,def){
  picker({
    title:`⚔️ ${atk.name} reta a ${def.name}`,
    sub:'Elige el sticker que quieres robarle.',
    items:def.wedges.map(id=>{const c=catById(id); return {label:c.name, emoji:c.glyph, color:c.color, value:id};}),
    cancel:true, onCancel:()=>nextTurn(0),
    onPick:cat=>duelRound(atk,def,cat,0)
  });
}
/* El duelo es un intercambio: primero ataca el retador, luego defiende el rival,
   y así sucesivamente. Sigue mientras AMBOS acierten. En cuanto uno falla, termina:
   - Si el retador falla su turno → se acaba el duelo, el sticker NO cambia.
   - Si el defensor falla su turno → el retador se lleva el sticker. */
function duelRound(atk,def,cat,round){
  const isAtk = round%2===0;                 // rondas pares: ataca el retador
  const who = isAtk?atk:def, other = isAtk?def:atk;
  const rd = Math.floor(round/2)+1;
  askQuestion(cat,{
    player:who,
    duel:true,
    badge:`${isAtk?'⚔️ Ataca':'🛡️ Defiende'} ${who.name} ${who.emoji} · ronda ${rd} · sticker de ${catById(cat).name}`,
    onDone:ok=>{
      if(ok){
        // acertó: le toca al otro; avisamos para pasar el dispositivo
        const nextIsAtk = !isAtk;
        picker({
          title: nextIsAtk?'⚔️ Sigue el retador':'🛡️ Turno de defender',
          sub:`${who.name} acertó. Pásale el dispositivo a ${other.name} ${other.emoji}. Si ${other.name} falla, ${nextIsAtk?`conserva su sticker de ${catById(cat).name}`:`pierde el sticker de ${catById(cat).name}`}.`,
          items:[{label:`Continuar, ${other.name}`, emoji:other.emoji, color:other.color, value:'go'}],
          onPick:()=>duelRound(atk,def,cat,round+1)
        });
        return;
      }
      // falló:
      if(isAtk){
        $('#note').textContent=`${atk.name} falló en el duelo. ${def.name} conserva su sticker de ${catById(cat).name}.`;
      }else{
        def.wedges=def.wedges.filter(c=>c!==cat);
        atk.wedges.push(cat); atk.coins+=30;
        renderPlayers(); SFX.crown();
        $('#note').textContent=`${atk.name} ganó el duelo y le quitó el sticker de ${catById(cat).name} a ${def.name}. +🪙 30`;
        if(atk.wedges.length===6) return win(atk);
      }
      nextTurn(0);
    }
  });
}

/* ============ PREGUNTAS ============ */
let Q={};
const asked=new Set();
function pick(cat){
  const want=$('#diff').value;
  let pool=QUESTIONS[cat];
  if(want!=='mix'){ const f=pool.filter(q=>String(q.d||1)===want); if(f.length) pool=f; }
  let fresh=pool.filter(q=>!asked.has(q));
  if(!fresh.length){ pool.forEach(q=>asked.delete(q)); fresh=pool; }
  const q=fresh[Math.floor(Math.random()*fresh.length)];
  asked.add(q);
  return q;
}
function askQuestion(cat, o){
  const src=pick(cat);
  Q={cat, src, p:o.player, crown:!!o.crown, duel:!!o.duel, badge:o.badge, onDone:o.onDone,
     correct:src.a[0], opts:shuffle(src.a.slice()), used:{}, done:false, second:false, timer:null, left:LIMIT};
  paintQuestion();
  $('#qScrim').classList.add('open');
  startTimer();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const HELPS=[
  {id:'bomba', icon:'💣', name:'Bomba', desc:'Quita 2 malas', cost:25},
  {id:'amigo', icon:'📞', name:'Amigo', desc:'Pide una pista', cost:30},
  {id:'cambio',icon:'🔄', name:'Cambio', desc:'Otra pregunta', cost:20},
  {id:'doble', icon:'❤️', name:'Segunda', desc:'Un fallo extra', cost:35}
];
function paintQuestion(){
  const c=catById(Q.cat), p=Q.p;
  $('#qHead').style.setProperty('--c',c.color);
  $('#qModal').style.setProperty('--c',c.color);
  $('#qCat').textContent=`${c.glyph} ${c.name}`;
  $('#qBadge').textContent = Q.badge || (Q.crown ? `👑 Sticker · ${p.name} ${p.emoji}` : `${p.name} ${p.emoji} · racha ${p.streak}`);
  $('#qDiff').textContent = (Q.src.d||1)===2 ? 'Difícil' : 'Normal';
  $('#qText').textContent=Q.src.q;
  const fig=$('#qFig'); fig.innerHTML='';
  if(Q.src.table) fig.appendChild(buildTable(Q.src.table));
  if(Q.src.svg){ const d=document.createElement('div'); d.className='fig-svg'; d.innerHTML=Q.src.svg; fig.appendChild(d); }
  if(Q.src.img){
    const src=typeof Q.src.img==='string' ? Q.src.img : Q.src.img.src;
    const alt=typeof Q.src.img==='string' ? 'Figura de la pregunta' : (Q.src.img.alt||'Figura de la pregunta');
    const d=document.createElement('div'); d.className='fig-img';
    const im=document.createElement('img'); im.src=src; im.alt=alt; im.loading='lazy';
    d.appendChild(im); fig.appendChild(d);
  }
  if(Q.src.sign){ const d=document.createElement('div'); d.className='fig-sign'; d.textContent=Q.src.sign; fig.appendChild(d); }
  if(Q.src.pasaje){ const d=document.createElement('div'); d.className='fig-text'; d.textContent=Q.src.pasaje; fig.appendChild(d); }
  const box=$('#qOpts'); box.innerHTML='';
  Q.opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o;
    b.onclick=()=>answer(b,o);
    box.appendChild(b);
  });
  $('#qVerdict').className='verdict';
  const h=$('#qHelp'); h.innerHTML='';
  HELPS.forEach(x=>{
    const b=document.createElement('button');
    b.className='hbtn'; b.disabled = Q.used[x.id] || p.coins<x.cost;
    b.innerHTML=`<b>${x.icon}</b>${x.name}<small>🪙 ${x.cost}</small>`;
    b.title=x.desc;
    b.onclick=()=>useHelp(x);
    h.appendChild(b);
  });
}
function startTimer(){
  Q.left=LIMIT; Q.paused=false;
  const bar=$('#timerBar'), num=$('#timerNum'), pb=$('#pauseBtn');
  bar.style.width='100%';
  clearInterval(Q.timer);
  let lastTick=99;
  const paint=()=>{
    const s=Math.max(0,Math.ceil(Q.left));
    num.textContent = Q.paused ? '⏸' : s+'s';
    num.classList.toggle('low', !Q.paused && Q.left<=5);
    bar.style.width=Math.max(0,(Q.left/LIMIT)*100)+'%';
    return s;
  };
  const noLimit = LIMIT>=999;
  pb.style.display = noLimit ? 'none' : '';
  pb.className='q-pause'; pb.textContent='⏸ Pausa';
  paint();
  Q.timer=setInterval(()=>{
    if(Q.paused || Q.done) return;
    Q.left-=0.1;
    const s=paint();
    if(Q.left<=5 && s!==lastTick){ lastTick=s; SFX.tick(); }
    if(Q.left<=0){clearInterval(Q.timer); timeout();}
  },100);
}
function togglePause(){
  if(Q.done || LIMIT>=999) return;
  Q.paused=!Q.paused;
  const pb=$('#pauseBtn'), num=$('#timerNum');
  pb.classList.toggle('paused',Q.paused);
  pb.textContent = Q.paused ? '▶ Reanudar' : '⏸ Pausa';
  num.textContent = Q.paused ? '⏸' : Math.max(0,Math.ceil(Q.left))+'s';
  num.classList.toggle('low', !Q.paused && Q.left<=5);
  SFX.help();
}
function timeout(){
  if(Q.done) return;
  Q.done=true;
  SFX.wrong();
  if(!Q.duel) Q.p.streak=0;   // en duelo el tiempo agotado no afecta la racha
  renderPlayers();
  [...$('#qOpts').children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===Q.correct) b.classList.add('right');
  });
  verdict(`⏱ <b>Se acabó el tiempo.</b> La respuesta era: ${escapeHtml(Q.correct)}`);
  finish(false);
}
function useHelp(x){
  const p=Q.p;
  if(p.coins<x.cost || Q.used[x.id] || Q.done) return;
  p.coins-=x.cost; Q.used[x.id]=true; renderPlayers(); SFX.help();
  if(x.id==='bomba'){
    const wrong=[...$('#qOpts').children].filter(b=>b.textContent!==Q.correct && !b.classList.contains('gone'));
    shuffle(wrong).slice(0,2).forEach(b=>{b.classList.add('gone'); b.disabled=true;});
  }
  if(x.id==='amigo'){
    const others=state.players.filter(pp=>pp.id!==p.id).map(pp=>pp.name);
    const friend=others.length? others[Math.floor(Math.random()*others.length)] : 'tu primo el sabelotodo';
    const acierta=Math.random()<0.75;
    const alive=[...$('#qOpts').children].filter(b=>!b.classList.contains('gone'));
    const guess = acierta ? Q.correct : shuffle(alive.map(b=>b.textContent).filter(t=>t!==Q.correct))[0] || Q.correct;
    alive.forEach(b=>{ if(b.textContent===guess) b.classList.add('hint'); });
    verdict(`📞 ${escapeHtml(friend)} dice: «Casi seguro es <b>${escapeHtml(guess)}</b>… pero no me hagas mucho caso».`);
  }
  if(x.id==='cambio'){
    clearInterval(Q.timer);
    askQuestion(Q.cat,{player:Q.p,crown:Q.crown,badge:Q.badge,onDone:Q.onDone});
    return;
  }
  if(x.id==='doble'){
    Q.second=true;
    verdict(`❤️ Tienes una segunda oportunidad: puedes fallar una vez.`);
  }
  [...$('#qHelp').children].forEach((b,i)=>{
    b.disabled = Q.used[HELPS[i].id] || p.coins<HELPS[i].cost;
  });
}
function verdict(html){const v=$('#qVerdict'); v.innerHTML=html; v.className='verdict show';}
function answer(btn,val){
  if(Q.done) return;
  const p=Q.p;
  if(val===Q.correct){
    clearInterval(Q.timer); Q.done=true;
    btn.classList.add('right');
    [...$('#qOpts').children].forEach(b=>b.disabled=true);
    if(!Q.duel) p.streak++;               // la racha NO cuenta en duelos
    p.coins += Q.crown ? 25 : 12;
    let msg;
    if(Q.crown){
      msg = `👑 <b>¡Sticker de ${catById(Q.cat).name}!</b> +🪙 25 y vuelves a lanzar.`;
    }else if(Q.duel){
      msg = `⚔️ <b>Correcto en el duelo.</b> +🪙 12`;
    }else{
      msg = `✅ <b>Correcto.</b> +🪙 12 · racha ${p.streak}`;
    }
    if(!Q.duel && p.streak>=STREAK_GOAL) msg+=` <b>🔥 Racha de ${p.streak}: puedes cobrar un sticker gratis en tu panel.</b>`;
    Q.crown ? SFX.crown() : SFX.right();
    renderPlayers();
    verdict(msg + expNote());
    finish(true);
  }else{
    btn.classList.add('wrong'); btn.disabled=true;
    if(Q.second){
      Q.second=false;
      tone(330,0,.2,{type:'square',vol:.12,to:220});
      verdict('❤️ Fallaste, pero la segunda oportunidad te salva. Prueba de nuevo.');
      return;
    }
    clearInterval(Q.timer); Q.done=true;
    SFX.wrong();
    const had = Q.duel ? 0 : p.streak;     // en duelo la racha no se toca
    if(!Q.duel) p.streak=0;
    renderPlayers();
    [...$('#qOpts').children].forEach(b=>{
      b.disabled=true;
      if(b.textContent===Q.correct) b.classList.add('right');
    });
    verdict(`❌ <b>Nada que hacer.</b> Era: ${escapeHtml(Q.correct)}${had?` · racha perdida (iba en ${had})`:''}`+expNote());
    finish(false);
  }
}
function expNote(){ return Q.src.exp ? `<div class="exp">💡 ${escapeHtml(Q.src.exp)}</div>` : ''; }
function buildTable(rows){
  const t=document.createElement('table'); t.className='q-table';
  rows.forEach((r,ri)=>{
    const tr=document.createElement('tr');
    r.forEach(cell=>{
      const el=document.createElement(ri===0?'th':'td');
      el.textContent=cell;
      tr.appendChild(el);
    });
    t.appendChild(tr);
  });
  return t;
}
function finish(ok){
  [...$('#qHelp').children].forEach(b=>b.disabled=true);
  const done=Q.onDone;
  const go=()=>{ $('#qScrim').classList.remove('open'); done(ok); };
  if(Q.src.exp || Q.src.pasaje){
    // dar tiempo de leer la aclaración: botón para continuar
    const v=$('#qVerdict');
    const b=document.createElement('button');
    b.className='cont-btn'; b.textContent='Continuar ▸';
    b.onclick=go;
    v.appendChild(b);
  }else{
    setTimeout(go,2100);
  }
}
function win(p){
  SFX.win();
  $('#wName').textContent=`Ganó ${p.name} ${p.emoji}`;
  $('#wScrim').classList.add('open');
}

/* ============ SELECTOR (corona / duelo / racha) ============ */
function picker(o){
  $('#cTitle').textContent=o.title;
  $('#cSub').textContent=o.sub||'';
  const box=$('#cPicks'); box.innerHTML='';
  o.items.forEach(it=>{
    const b=document.createElement('button');
    b.className='pick'; b.style.setProperty('--c',it.color||'#fff');
    b.innerHTML=`<span class="pe">${it.emoji||''}</span><span>${escapeHtml(it.label)}</span>`;
    b.onclick=()=>{ SFX.help(); $('#cScrim').classList.remove('open'); o.onPick(it.value); };
    box.appendChild(b);
  });
  const cx=$('#cCancel');
  cx.style.display=o.cancel?'':'none';
  cx.onclick=()=>{ $('#cScrim').classList.remove('open'); if(o.onCancel) o.onCancel(); };
  $('#cScrim').classList.add('open');
}

/* ============ MODALES ============ */
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>e.target.closest('.scrim').classList.remove('open'));
let pickedEmoji=null;
function paintEmojis(){
  const taken=state.players.filter(p=>!editing||p.id!==editing).map(p=>p.emoji);
  const box=$('#pEmojis'); box.innerHTML='';
  EMOJIS.forEach(e=>{
    const b=document.createElement('button');
    b.className='em'+(e===pickedEmoji?' sel':'')+(taken.includes(e)?' taken':'');
    b.textContent=e; b.type='button';
    b.onclick=()=>{ pickedEmoji=e; SFX.help(); paintEmojis(); };
    box.appendChild(b);
  });
}
function openPlayerModal(id){
  editing=id||null;
  const p=id? state.players.find(x=>x.id===id) : null;
  $('#pTitle').textContent = p? 'Editar jugador' : 'Agregar jugador';
  $('#pSave').textContent = p? 'Guardar' : 'Agregar';
  $('#pName').value = p? p.name : '';
  const taken=state.players.filter(x=>!p||x.id!==p.id).map(x=>x.emoji);
  pickedEmoji = p? p.emoji : (EMOJIS.find(e=>!taken.includes(e))||EMOJIS[0]);
  paintEmojis();
  $('#pScrim').classList.add('open');
  if(!p) $('#pName').focus();
}
$('#addPlayerBtn').onclick=()=>openPlayerModal(null);
$('#pSave').onclick=()=>{
  const n=$('#pName').value.trim();
  if(!n){ $('#pName').focus(); return; }
  if(editing){
    const p=state.players.find(x=>x.id===editing);
    p.name=n; p.emoji=pickedEmoji;
  }else{
    const p=newPlayer(n,state.players.length);
    p.emoji=pickedEmoji;
    state.players.push(p);
  }
  editing=null;
  $('#pScrim').classList.remove('open');
  renderAll();
};
$('#pName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#pSave').click();});

$('#nqCat').innerHTML=CATS.map(c=>`<option value="${c.id}">${c.glyph} ${c.name}</option>`).join('');
$('#limit').onchange=e=>{ LIMIT=+e.target.value; };
$('#nqOpts').innerHTML=[0,1,2,3].map(i=>`
  <div class="row" style="margin-bottom:6px">
    <input type="radio" name="nqc" value="${i}" ${i===0?'checked':''} aria-label="Marcar opción ${i+1} como correcta">
    <input class="nqa" placeholder="Respuesta ${i+1}">
  </div>`).join('');
$('#addQBtn').onclick=()=>$('#nqScrim').classList.add('open');
$('#nqSave').onclick=()=>{
  const cat=$('#nqCat').value;
  const text=$('#nqText').value.trim();
  const opts=[...document.querySelectorAll('.nqa')].map(i=>i.value.trim());
  const ci=+document.querySelector('input[name=nqc]:checked').value;
  if(!text||opts.some(o=>!o)) { alert('Completa la pregunta y las cuatro respuestas.'); return; }
  const ordered=[opts[ci],...opts.filter((_,i)=>i!==ci)];
  QUESTIONS[cat].push({q:text,a:ordered,d:+$('#nqDiff').value});
  $('#nqText').value=''; document.querySelectorAll('.nqa').forEach(i=>i.value='');
  $('#nqScrim').classList.remove('open');
  renderLegend();
};
$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(QUESTIONS,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='preguntas-saber11.json'; a.click();
  URL.revokeObjectURL(a.href);
};
$('#importBtn').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      CATS.forEach(c=>{ if(Array.isArray(data[c.id])) QUESTIONS[c.id]=data[c.id]; });
      renderLegend();
      alert('Preguntas cargadas.');
    }catch(err){ alert('Ese archivo no tiene el formato esperado.'); }
    e.target.value='';
  };
  r.readAsText(f);
};
$('#resetBtn').onclick=()=>{ if(confirm('¿Reiniciar la partida con los mismos jugadores?')) reset(rosterOf()); };
$('#wAgain').onclick=()=>{$('#wScrim').classList.remove('open'); reset(rosterOf());};

reset();
</script>
</body>
</html>
